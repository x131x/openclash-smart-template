; ==========================================================
; OpenClash + Smart + LightGBM 通用订阅转换模板
; Version: 1.0
; Format: SubConverter [custom] INI
;
; 使用说明：
; 1. 在订阅转换服务中选择/粘贴本文件作为自定义配置。
; 2. OpenClash 选择 Smart 核心，并开启“自动转换 Smart 策略组”。
; 3. OpenClash 的 Smart 设置中开启“启用 LightGBM 模型”。
; 4. AI服务、YouTube、国际聊天工具分别定义为独立 url-test 业务组，
;    由 OpenClash 自动转换为独立 Smart 组；三组共用全局 LightGBM 模型文件。
; 5. LightGBM 模型下载地址、自动更新周期属于全局设置，不在订阅转换 INI 中逐组设置。
; 6. 本文件不包含机场订阅地址；机场订阅由订阅转换服务另行添加。
;
; AI 香港过滤：
; - AI / ChatGPT / Claude / Gemini / Copilot 的自动和手动节点组
;   均使用负向正则排除常见香港节点命名。
; - AI 组不引用通用“全部节点”组，避免从通用组绕过过滤。
; - 仅按节点名称过滤。若机场使用无地区信息的节点名，需补充规则。
;
; 兼容性提示：
; - 自动组先定义为 url-test，依赖 OpenClash 自动 Smart 转换。
; - LightGBM 并非普通订阅转换 INI 字段，需在 OpenClash 中单独启用。
; - 规则使用内置 DOMAIN-SUFFIX / GEOIP / FINAL 形式，避免依赖第三方规则文件。
; ==========================================================

[custom]

enable_rule_generator=true
overwrite_original_rules=true

; ==========================================================
; 01. 通用策略组
; ==========================================================

custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🚀 手动选择`[]DIRECT
custom_proxy_group=🚀 手动选择`select`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50

; ==========================================================
; 02. 地区自动组
; OpenClash 开启自动 Smart 转换后，这些 url-test 组转为 Smart
; ==========================================================

custom_proxy_group=🇭🇰 香港节点`url-test`(?i)(香港|Hong[ ._-]?Kong|HKG|🇭🇰)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本节点`url-test`(?i)(日本|东京|大阪|Japan|Tokyo|Osaka|JP|🇯🇵)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 新加坡节点`url-test`(?i)(新加坡|狮城|Singapore|SG|🇸🇬)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇹🇼 台湾节点`url-test`(?i)(台湾|台北|新北|Taiwan|Taipei|TW|🇹🇼)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇰🇷 韩国节点`url-test`(?i)(韩国|首尔|Korea|Seoul|KR|🇰🇷)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🌏 亚洲其他节点`url-test`(?i)(马来西亚|Malaysia|MY|泰国|Thailand|TH|越南|Vietnam|VN|菲律宾|Philippines|PH|印尼|Indonesia|ID)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇸 美国节点`url-test`(?i)(美国|美西|美东|洛杉矶|圣何塞|西雅图|纽约|United States|USA|US|🇺🇸)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇪🇺 欧洲节点`url-test`(?i)(德国|英国|法国|荷兰|瑞士|意大利|西班牙|波兰|欧洲|Germany|United Kingdom|France|Netherlands|Europe|DE|UK|FR|🇪🇺)`http://www.gstatic.com/generate_204`300,,50

; ==========================================================
; 03. AI 专用节点组
; 负向正则排除常见香港标记；不引用通用全节点组
; ==========================================================

; AI 专用手动节点：排除香港命名
custom_proxy_group=🤖 AI手动节点`select`(?i)^(?!.*(香港|Hong[ ._-]?Kong|HKG|🇭🇰)).*$

; AI 专用自动节点：排除香港命名
custom_proxy_group=🤖 AI自动选择`url-test`(?i)^(?!.*(香港|Hong[ ._-]?Kong|HKG|🇭🇰)).*$`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🤖 AI服务`url-test`(?i)^(?!.*(香港|Hong[ ._-]?Kong|HKG|🇭🇰)).*$`http://www.gstatic.com/generate_204`300,,50

; ==========================================================
; 三个业务组各自独立测速/选线；OpenClash 自动 Smart 转换后成为独立 Smart 组。
; LightGBM 通过 OpenClash 全局 Smart 设置启用，三个组共用同一模型文件。
; 04. 非 AI 业务组（保留香港节点）
; ==========================================================

custom_proxy_group=🔎 Google服务`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇹🇼 台湾节点`[]🇰🇷 韩国节点`[]🇺🇸 美国节点`[]🇪🇺 欧洲节点`[]DIRECT
custom_proxy_group=📲 Google FCM`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇹🇼 台湾节点`[]🇺🇸 美国节点`[]DIRECT
custom_proxy_group=📺 YouTube`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🎬 Netflix`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇹🇼 台湾节点`[]🇺🇸 美国节点`[]DIRECT
custom_proxy_group=🎵 Spotify`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]DIRECT
custom_proxy_group=💬 国际聊天工具`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🍎 Apple服务`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点
custom_proxy_group=🪟 Microsoft服务`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点
custom_proxy_group=🎮 游戏平台`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点
custom_proxy_group=🌍 国外流量`select`[]🚀 节点选择`[]♻️ 自动选择`[]🚀 手动选择`[]DIRECT
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]♻️ 自动选择`[]🚀 手动选择`[]DIRECT

