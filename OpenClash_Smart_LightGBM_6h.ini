; ==========================================================
; OpenClash + Smart + LightGBM 通用订阅转换模板
; Version: 1.4
; Format: SubConverter [custom] INI
;
; 使用说明：
; 1. 在订阅转换服务中选择/粘贴本文件作为自定义配置。
; 2. OpenClash 选择 Smart 核心，并开启“自动转换 Smart 策略组”。
; 3. OpenClash 的 Smart 设置中开启“启用 LightGBM 模型”。
; 4. 每个非直连业务组（含 GitHub、成人网站、SIS001）均定义为独立 url-test 候选组，
;    由 OpenClash 自动转换为独立 Smart 组；所有组共用全局 LightGBM 模型文件。
; 5. LightGBM 模型下载地址、自动更新周期属于全局设置，不在订阅转换 INI 中逐组设置。
; 6. 本文件不包含机场订阅地址；机场订阅由订阅转换服务另行添加。
;
; AI 香港过滤：
; - 所有 AI 服务统一进入唯一的 🤖 AI自动选择 组。
; - SubConverter 的 custom_proxy_group 节点筛选表达式不能可靠实现任意字符串的负向排除；此处先纳入全部节点。
; - 要真正排除香港，必须在 OpenClash 生成的 Mihomo proxy-groups 对应组中增加 exclude-filter。
; - 推荐排除标记：香港、Hong Kong/HongKong/Hong-Kong/Hong_Kong、HKG、独立 HK、🇭🇰。
; - 注意：本 INI 单独转换时尚未完成香港排除；需将下方 YAML 字段合并到生成配置的 AI 组，并确认核心支持。
;
; 兼容性提示：
; - 自动组先定义为 url-test，依赖 OpenClash 自动 Smart 转换。
; - LightGBM 并非普通订阅转换 INI 字段，需在 OpenClash 中单独启用。
; - 规则使用内置 DOMAIN-SUFFIX / GEOIP / FINAL 形式，避免依赖第三方规则文件。
; ==========================================================

[custom]

enable_rule_generator=true
overwrite_original_rules=true

; ==========================================================
; 01. 通用策略组
; ==========================================================


; ==========================================================
; 02. 业务策略组
; 不按地区分组；每个非直连业务组独立定义为 Smart 转换候选
; ==========================================================


; ==========================================================
; 03. AI 专用节点组
; 先纳入全部机场节点；生成 Mihomo YAML 后，必须给该组增加 exclude-filter 排除香港
; ==========================================================

; AI自动组：Smart 自动选线；香港排除需在生成 YAML 中增加 exclude-filter
custom_proxy_group=🤖 AI自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50

; ==========================================================
; 所有非直连业务组各自独立测速/选线；OpenClash 自动 Smart 转换后成为独立 Smart 组。
; LightGBM 通过 OpenClash 全局 Smart 设置启用，各组共用同一模型文件。
; Apple / Microsoft 更新 CDN 与明确的游戏下载 CDN 直连；其余国际服务按业务组代理。
; 04. 非 AI 业务组（保留香港节点；含独立 GitHub / 成人网站 Smart 组）
; ==========================================================

custom_proxy_group=🔎 Google服务`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=📲 Google FCM`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=📺 YouTube`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🎬 Netflix`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🎵 Spotify`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🐙 GitHub`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🔞 成人网站`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=𝕏 X`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=💬 国际聊天工具`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🎮 游戏平台`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🌍 国外流量`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🎯 全球直连`select`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`url-test`.*`http://www.gstatic.com/generate_204`300,,50

