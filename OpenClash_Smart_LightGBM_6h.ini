; ==========================================================
; AI 组香港排除：生成 Mihomo YAML 后合并以下字段（不是 SubConverter INI 字段）
; ==========================================================
; proxy-groups:
;   - name: 🤖 AI自动选择
;     exclude-filter: '(?i)(香港|Hong[ ._-]*Kong|HKG|(^|[^A-Za-z])HK([^A-Za-z]|$)|🇭🇰)'
; 说明：该字段必须放在生成 YAML 中同名 AI 策略组下面，不能直接粘贴进 [custom]。
; 如果你的 OpenClash 自动 Smart 转换会重写策略组，请使用其持久化自定义配置/覆写入口保存该字段，避免订阅更新后丢失。
