; OprX / OpenClash 通用订阅转换模板
; SubConverter-Extended external INI / target=clash
; 多订阅输入由转换请求提供；本模板不写死机场地址。
; 代理组统一使用 SubConverter 标准支持的 url-test 类型，确保转换器能够稳定解析。
; OpenClash Smart 自动转换覆写在启动阶段把 url-test / load-balance 组转换为 type: smart。
; 因此必须启用该覆写；最终是否生效，以 OpenClash 生成的运行配置 type: smart 为准。
; AI 组单独排除香港；其余代理组匹配全部节点、不限制地区。
; 国内媒体组及国内规则直连；广告拦截规则已移除。
; Smart 核心负责智能节点评估；不另建独立 fallback 组，避免把策略组切回非 Smart。
; DNS / IPv6 / QUIC 由 OpenClash 覆写设置维护，避免转换器模板覆盖本机 DNS 参数。

[custom]
enable_rule_generator=true
overwrite_original_rules=true
; 统一主 Smart 节点池
custom_proxy_group=🚀 节点选择`url-test`.*`https://www.gstatic.com/generate_204`180,,80
custom_proxy_group=📲 电报消息`url-test`.*`https://www.gstatic.com/generate_204`180,,80
